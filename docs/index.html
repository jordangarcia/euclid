<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#1D6B45">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Euclid">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Euclid — 101 silhouettes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F2EE; --ink:#151515; --ink-soft:#6E6E6A; --sil:#1A1A1A; --green:#1D6B45; --green-ink:#FFFFFF;
  --chip:#00000010; --line:#00000026; --hint:#FFFFFF; --wood-a:#8E4F27; --wood-b:#B6743F; --wood-line:#4A250F;
  color-scheme: light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#000000; --ink:#FFFFFF; --ink-soft:#9A9A96; --sil:#8F8F8B; --green:#1F7149; --green-ink:#FFFFFF;
  --chip:#FFFFFF14; --line:#FFFFFF2A; --hint:#FFFFFF; color-scheme: dark; } }
:root[data-theme="dark"]{ --bg:#000000; --ink:#FFFFFF; --ink-soft:#9A9A96; --sil:#8F8F8B; --green:#1F7149; --green-ink:#FFFFFF;
  --chip:#FFFFFF14; --line:#FFFFFF2A; --hint:#FFFFFF; color-scheme: dark; }
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New",system-ui,-apple-system,"Hiragino Sans",sans-serif;
  display:flex;flex-direction:column;overflow:hidden;-webkit-tap-highlight-color:transparent}
header{display:flex;align-items:stretch;gap:0;min-height:64px}
.band{background:var(--green);color:var(--green-ink);display:flex;flex-direction:column;justify-content:center;padding:8px 14px 8px 16px;line-height:1}
.band .nob{font-weight:900;font-size:17px;letter-spacing:.02em}
.band .series{font-size:8.5px;letter-spacing:.04em;opacity:.85;margin-top:2px;white-space:nowrap}
.title{display:flex;align-items:center;padding:0 14px;margin-right:auto;gap:8px}
.title b{font-weight:900;font-size:30px;letter-spacing:-0.03em;line-height:1}
.title small{font-size:11px;color:var(--ink-soft);align-self:flex-start;margin-top:14px}
.nav{display:flex;align-items:center;gap:2px;padding-right:10px}
.num{font-weight:900;font-size:20px;min-width:4ch;text-align:center;font-variant-numeric:tabular-nums;background:none;border:0;color:var(--ink);cursor:pointer;padding:6px;border-radius:6px;font-family:inherit}
.icon{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--ink);font-size:18px;cursor:pointer;display:grid;place-items:center}
.icon:disabled{opacity:.3}
main{flex:1;min-height:0;position:relative}
svg#board{width:100%;height:100%;display:block;touch-action:none;user-select:none}
.sil{fill:var(--sil);transition:fill .4s}
.solved .sil{fill:var(--green)}
.piece{cursor:grab}
.piece polygon{fill:url(#wood);stroke:var(--wood-line);stroke-width:.022;stroke-linejoin:round}
.piece.sel polygon{stroke:var(--hint);stroke-width:.05}
:root:not([data-theme="dark"]) .piece.sel polygon{stroke:var(--green)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .piece.sel polygon{stroke:#fff} }
.piece.drag{cursor:grabbing}
.goal{position:absolute;top:10px;right:12px;width:92px;height:92px;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);cursor:zoom-in}
.goal svg{width:100%;height:100%;display:block}
.solved .goal{border-color:var(--green)}
.full{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:zoom-out;padding:6vmin}
.full[hidden]{display:none}
.full svg{width:min(88vw,80vh);height:min(88vw,80vh)}
.full p{color:var(--ink-soft);font-size:13px;margin:12px 0 0}
.axis{stroke:var(--green);stroke-width:.025;stroke-dasharray:.08 .06;pointer-events:none}
.fliph{cursor:grab}
.fliph.active{cursor:grabbing}
.fliph .hit{fill:transparent}
.fliph circle:not(.hit){fill:var(--green)}
.fliph.active circle:not(.hit){r:.23}
.piece.flipping polygon{filter:brightness(.8)}
.tray-line{stroke:var(--line);stroke-width:.012}
footer{display:flex;gap:8px;justify-content:center;padding:10px 12px 14px;flex-wrap:wrap}
.btn{border:1px solid var(--line);border-radius:999px;padding:10px 18px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;background:none;color:var(--ink)}
.btn[aria-pressed="true"]{background:var(--green);color:var(--green-ink);border-color:var(--green)}
.btn:focus-visible,.icon:focus-visible,.num:focus-visible,.cell:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.toast{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:var(--green);color:var(--green-ink);padding:9px 10px 9px 16px;border-radius:999px;font-weight:700;display:flex;gap:10px;align-items:center;opacity:0;pointer-events:none;transition:opacity .25s;white-space:nowrap}
.toast.show{opacity:1;pointer-events:auto}
.toast button{border:0;background:var(--green-ink);color:var(--green);border-radius:999px;padding:6px 12px;font:inherit;font-weight:700;cursor:pointer}
dialog{border:0;border-radius:4px;background:var(--bg);color:var(--ink);padding:0;width:min(720px,94vw);max-height:86vh;border-left:10px solid var(--green)}
dialog::backdrop{background:#000a}
.dhead{display:flex;align-items:center;padding:14px 16px;gap:12px;position:sticky;top:0;background:var(--bg)}
.dhead h2{margin:0;font-size:20px;font-weight:900;margin-right:auto}
.dhead span{color:var(--ink-soft);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:6px;padding:0 16px 16px;overflow:auto;max-height:calc(86vh - 70px)}
.cell{border:1px solid var(--line);background:none;border-radius:4px;padding:4px 4px 2px;cursor:pointer;color:var(--ink-soft);font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center}
.cell svg{width:100%;aspect-ratio:1}
.cell svg path{fill:var(--sil)}
.cell.done{border-color:var(--green);color:var(--green)}
.cell.done svg path{fill:var(--green)}
.cell.cur{outline:2px solid var(--ink)}
.help{font-size:12px;color:var(--ink-soft);text-align:center;padding:0 12px;margin:0}
@media (max-width:420px){ .title small{display:none} .title b{font-size:26px} .band{padding:8px 10px} }
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>

<header>
  <div class="band" aria-hidden="true"><span class="nob">NOB</span><span class="series">PUZZLE SERIES</span></div>
  <div class="title"><b>Euclid</b><small>ユークリッド</small></div>
  <div class="nav">
    <button class="icon" id="prev" aria-label="Previous puzzle">‹</button>

</header>
<main>

    <line id="trayline" class="tray-line"/><g id="pieces"></g><g id="flipui"></g>

  <button class="goal" id="goal" aria-label="Show the target silhouette full screen"><svg id="goalsvg"><path class="sil" id="goalpath" fill-rule="evenodd"/></svg></button>
  <div class="toast" id="toast" role="status"><span id="toastmsg">Solved</span><button id="toastnext">Next puzzle</button></div>
</main>
<p class="help" id="help">Build the shape in the corner. Drag the green dot around a piece to turn it, or through its middle to flip it.</p>
<footer>
  <button class="btn" id="rot">Turn</button>
  <button class="btn" id="flip">Flip</button>
  <button class="btn" id="reset">Reset</button>
</footer>
<div class="full" id="full" role="dialog" aria-label="Target silhouette" hidden><svg id="fullsvg"><path class="sil" id="fullpath" fill-rule="evenodd"/></svg><p>Tap anywhere to close</p></div>
<dialog id="picker"><div class="dhead"><h2>Silhouettes</h2><span id="count"></span><button class="icon" id="close" aria-label="Close">×</button></div><div class="grid" id="grid"></div></dialog>
